
<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Olamide Amusan | Full-Stack Developer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root{
          --grad-1-start: #FFFDEE;
          --grad-1-end:   #E3EF26;
          --grad-2-start: #E2FBCE;
          --grad-2-end:   #076653;
          --grad-3-start: #E3EF26;
          --grad-3-end:   #0C342C;
          --grad-4-start: #076653;
          --grad-4-end:   #06231D;
          --accent: var(--grad-2-end);
          --accent-2: var(--grad-1-end);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #09090b;
            color: #fafafa;
        }
        h1, h2, h3, h4, h5, h6 {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .glass-card {
            background: rgba(24, 24, 27, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .text-gradient {
            background: linear-gradient(to right, var(--grad-1-start), var(--grad-2-end));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .bg-gradient-primary {
            background: linear-gradient(135deg, var(--grad-2-start) 0%, var(--grad-3-start) 100%);
        }

        /* Override common Tailwind utility classes to match brand gradients */
        .from-indigo-500{ --tw-gradient-from: var(--grad-2-start); }
        .to-indigo-600{ --tw-gradient-to: var(--grad-4-end); }
        .from-purple-500{ --tw-gradient-from: var(--grad-3-start); }
        .to-purple-600{ --tw-gradient-to: var(--grad-4-end); }
        .text-indigo-400{ color: var(--accent) !important; }
        .text-indigo-300{ color: var(--accent-2) !important; }
        .border-indigo-500{ border-color: var(--grad-2-start) !important; }
        .hover\:border-indigo-500:hover{ border-color: var(--grad-2-start) !important; }
        .hover\:text-indigo-400:hover{ color: var(--accent) !important; }

        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #09090b;
        }
        ::-webkit-scrollbar-thumb {
            background: #27272a;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #3f3f46;
        }
    </style>
<script type="importmap">

}
